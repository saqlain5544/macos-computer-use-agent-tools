[package]
name = "agent-driver"
version = "0.1.0"
edition = "2021"
description = "A quiet desktop where background agents can work without disturbing the person"

[[bin]]
name = "agent-driver"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
png = "0.18.1"
winit = "0.30.13"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
