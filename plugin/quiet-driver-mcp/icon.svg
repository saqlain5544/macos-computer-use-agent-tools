<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Quiet Driver">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)" stroke="#3f6fb5" stroke-width="2"/>
  <!-- a quiet window behind -->
  <rect x="11" y="15" width="26" height="20" rx="3" fill="none" stroke="#54749e" stroke-width="2"/>
  <!-- the bound window, lit -->
  <rect x="24" y="28" width="29" height="22" rx="3" fill="#132038" stroke="#7fd1c4" stroke-width="2"/>
  <!-- the agent's cursor -->
  <circle cx="40" cy="38" r="5.5" fill="none" stroke="#7fd1c4" stroke-width="2"/>
  <circle cx="40" cy="38" r="1.6" fill="#7fd1c4"/>
  <!-- a muted person -->
  <circle cx="19" cy="45" r="4" fill="none" stroke="#8aa0bf" stroke-width="2"/>
  <path d="M12 54a7 7 0 0 1 14 0" fill="none" stroke="#8aa0bf" stroke-width="2"/>
</svg>
